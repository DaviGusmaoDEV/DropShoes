<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Sou Velune | Login</title>
    <link rel="stylesheet" href="./css/souvelune.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <header>
        <a href="souvelune.html" class="logo">Sou<span>Velune</span></a>
    </header>
    <main class="container">
        <div class="auth-login">
            <h2 class="auth-title">Seja bem-vindo a nossa Loja!</h2>
        <form class="login-form" id="form-login">
            <input class="email" type="email" name="email" placeholder="Seu E-mail" required>
            <input class="senha" type="password" name="senha" placeholder="Sua Senha" required>
            
            <button class="btn-entrar" type="submit">Entrar</button>
            <p style="margin-top: 15px; text-align: center;">Não tem conta? <a href="cadastro-souvelune.html">Criar conta</a></p>
        </form>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
