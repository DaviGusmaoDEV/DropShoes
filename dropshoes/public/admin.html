<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>DropShoes | Painel Administrativo</title>
    
    <script src="js/auth-guard.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css"> </head>
<body class="admin-body">

    <header class="admin-header">
        <a href="index.html" class="logo-admin">Drop<span>Shoes</span> Painel</a>
        <a href="index.html" class="btn-voltar">← Voltar para a Loja</a>
    </header>

    <main class="admin-container">
        
        <section class="admin-card">
            <h2>Cadastrar Novo Tênis</h2>
            <p class="subtitle">Adicione novos produtos para atualizar a vitrine em tempo real.</p>
            
            <form id="form-produto" action="/api/produtos" method="POST" enctype="multipart/form-data">
                <div class="admin-group">
                    <label for="nome-produto">Nome do Modelo</label>
                    <input type="text" id="nome-produto" name="nome" class="admin-control" placeholder="Ex: Nike Air Max 90" required>
                </div>

                <div class="admin-group">
                    <label for="preco-produto">Preço de Venda (R$)</label>
                    <input type="number" id="preco-produto" name="preco" step="0.01" class="admin-control" placeholder="Ex: 599.90" required>
                </div>

                <div class="admin-group">
                    <label for="tamanhos-produto">Tamanhos Disponíveis</label>
                    <input type="text" id="tamanhos-produto" name="tamanhos" class="admin-control" placeholder="Separe por vírgula. Ex: 38, 39, 40, 41" required>
                </div>

                <div class="admin-group">
                    <label>Foto do Tênis</label>
                    <label class="file-wrapper">
                        <span class="file-icon">📸</span>
                        <span style="font-size: 13px; color: var(--text-muted); font-weight: 500;">Clique para escolher ou arraste a foto</span>
                        <input type="file" id="foto-produto" name="foto" accept="image/*" required>
                    </label>
                </div>

                <button id="btn-salvar-produto" type="submit" class="btn-salvar">Publicar na Vitrine</button>
            </form>
        </section>

        <section class="admin-card">
            <h2>Produtos Cadastrados</h2>
            <p class="subtitle">Lista de tênis ativos que estão salvos no banco de dados.</p>
            
            <div class="table-responsive">
                <table class="modern-table">
                    <thead>
                        <tr>
                            <th>Foto</th>
                            <th>Produto</th>
                            <th>Preço</th>
                            <th>Tamanhos</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-admin-produtos">
                        </tbody>
                </table>
            </div>
        </section>

    </main>

    <template id="template-linha-tabela">
        <tr>
            <td><img src="" alt="" class="img-preview"></td>
            <td><strong class="nome-produto"></strong></td>
            <td class="preco-produto"></td>
            <td class="tamanhos-produto"></td>
            <td>
                <button class="btn-editar">Editar</button>
                <button class="btn-excluir">Excluir</button>
            </td>
        </tr>
    </template>

    <script src="js/main.js"></script>
</body>
</html>
