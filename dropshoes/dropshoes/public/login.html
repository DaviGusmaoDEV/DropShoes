<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>DropShoes | Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">Drop<span>Shoes</span></a>
    </header>

    <main class="container">
        <div class="auth-container">
            <h2>Login</h2>
            
            <div class="form-group">
                 <label for="login-email">E-mail</label>
                 <input type="email" id="login-email" class="form-control" placeholder="admin@dropshoes.com" required>
            </div>

            <div class="form-group">
                <label for="login-senha">Senha</label>
                <input type="password" id="login-senha" class="form-control" placeholder="••••••••" required>
            </div>

            <button class="btn btn-primary" onclick="fazerLogin(event)">Entrar</button>
            
            <p style="margin-top: 15px; text-align: center;">Não tem conta? <a href="cadastro.html">Criar conta</a></p>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
