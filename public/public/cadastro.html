<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>DropShoes | Registro</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <header><a href="index.html" class="logo">Drop<span>Shoes</span></a></header>
    <main class="container">
            <form id="form-cadastro" class="auth-login">
                <h2 class="auth-title">Crie sua conta na DropShoes!</h2>
                <input class="form-control nome" type="text" name="nome" placeholder="Nome Completo" required>
                <input class="form-control email" type="email" name="email" placeholder="E-mail" required>
                <input class="form-control senha" type="password" name="senha" placeholder="Senha" required>

                <button class="btn-cadastro" type="submit">Cadastrar</button>
                <p style="margin-top: 15px; text-align: center;">Já tem conta? <a href="login.html">Entrar</a></p>
            </form>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
