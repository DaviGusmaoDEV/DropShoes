<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sou Velune | Registro</title>
    <link rel="stylesheet" href="./css/souvelune.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <header><a href="souvelune.html" class="logo">Sou<span>Velune</span></a></header>
    <main class="container">
            <form id="form-cadastro" class="auth-login">
                <h2 class="auth-title">Crie sua conta na Sou Velune!</h2>
                <input type="text" name="nome" placeholder="Nome Completo" required>
                <input type="email" name="email" placeholder="E-mail" required>
                <input type="password" name="senha" placeholder="Senha" required>
                
                <button class="btn-entrar" type="submit">Cadastrar</button>
                <p style="margin-top: 15px; text-align: center;">Já tem conta? <a href="login-souvelune.html">Entrar</a></p>
            </form>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
