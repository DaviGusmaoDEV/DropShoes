<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>DropShoes | Obrigado pela Compra</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh; text-align: center;">
    <script>
        Swal.fire({
            icon: 'success',
            title: 'Pagamento Confirmado!',
            text: 'Seu pedido já começou a ser separado. Obrigado por comprar na DropShoes!',
            confirmButtonText: 'Voltar para a Loja',
            confirmButtonColor: '#2980b9'
        }).then(() => {
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
