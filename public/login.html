<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicias Da Lucy | Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

    <div class="login-container">
        <form id="form-login" class="card-login">
            <a href="index.html" class="logo">Delicias<span> Da Lucy</span></a>
            <h2>Acessar sua conta</h2>
            
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" class="form-control" placeholder="seu@email.com" required>
            </div>
            
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" class="form-control" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn btn-primary">Entrar</button>
            
            <p class="login-footer">
                Não tem conta? <a href="cadastro.html">Criar agora</a>
            </p>
        </form>
    </div>

</body>
</html>
