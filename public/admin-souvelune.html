<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Sou Velune | Painel Administrativo</title>
    
    <script src="js/auth-guard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="./css/souvelune.css">
</head>
<body class="admin-body">

    <header class="admin-header">
        <a href="souvelune.html" class="logo">Sou<span>Velune</span> Admin</a>
        <a href="souvelune.html" class="btn btn-header-voltar">← Voltar para a Loja</a>
    </header>

    <main class="admin-container">
        
        <section class="admin-card admin-section-cadastro">
            <h2 class="section-title">Cadastrar Novo Conjunto</h2>
            <p class="product-label admin-subtitle">Adicione novos produtos para atualizar a vitrine em tempo real.</p>
            
           <form id="form-produto" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="form-nome">Nome do Modelo</label>
                    <input type="text" id="form-nome" name="nome" placeholder="Ex: Conjunto Satin Quartzo" required>
                </div>

                <div class="form-group">
                    <label for="form-preco">Preço de Venda (R$)</label>
                    <input type="number" id="form-preco" name="preco" step="0.01" placeholder="Ex: 149,90" required>
                </div>

                <div class="form-group">
                    <label>Tamanhos Disponíveis</label>
                    <div class="tamanho-selector">
                        <label><input type="checkbox" name="tamanho" value="P"> <span>P</span></label>
                        <label><input type="checkbox" name="tamanho" value="M"> <span>M</span></label>
                        <label><input type="checkbox" name="tamanho" value="G"> <span>G</span></label>
                        <label><input type="checkbox" name="tamanho" value="GG"> <span>GG</span></label>
                        <label><input type="checkbox" name="tamanho" value="XG"> <span>XG</span></label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Foto da Peça</label>
                    <label class="file-wrapper">
                        <span class="file-icon file-icon-span">📸</span>
                        <span class="file-text-span">Clique para escolher ou arraste a foto</span>
                        <input type="file" id="foto-produto" name="foto" accept="image/*" style="display: none;" required>
                    </label>
                </div>

                <button id="btn-salvar-produto" type="submit" class="btn btn-dark btn-admin-publicar">Publicar na Vitrine</button>
            </form>
        </section>

        <section class="admin-card">
            <h2 class="section-title">Produtos Cadastrados</h2>
            <p class="product-label admin-subtitle">Lista de modelos ativos que estão salvos no banco de dados.</p>
            
            <div class="admin-table-container">
                <table class="modern-table">
                     <thead>
                        <tr>
                            <th>Foto</th>
                            <th>Produto</th>
                            <th>Preço</th>
                            <th>Tamanhos</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-admin-produtos">
                        </tbody>
                </table>
            </div>
        </section>

    </main>

    <template id="template-linha-tabela">
        <tr>
            <td><img src="" alt="" class="img-preview"></td>
            <td><strong class="produto-titulo td-titulo-produto"></strong></td>
            <td class="produto-preco td-preco-produto"></td>
            <td><span class="tamanhos-produto td-tamanhos-lista"></span></td>
            <td>
                <div class="acoes-flex-container">
                    <button class="btn-editar-tabela btn-editar">Editar</button>
                    <button class="btn-delete btn-excluir">Excluir</button>
                </div>
            </td>
        </tr>
    </template>

    <script src="js/main.js"></script>
</body>
</html>
