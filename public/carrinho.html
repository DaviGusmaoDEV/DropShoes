<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><title>DropShoes | Carrinho</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <header>
        <a href="index.html" class="logo">Drop<span>Shoes</span></a>
        <nav>
            <a href="index.html">Início</a>
            <a href="carrinho.html">Carrinho</a>
            <a href="produto.html">Produtos</a>
            <a href="login.html" id="btn-auth">Minha Conta</a>
        </nav>
    </header>
<section class="box-sidebar">
    <h3>🛒 Seu Carrinho</h3>
    
    <div id="itens-carrinho">
        </div>

    <div style="margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 20px;">
        <label style="font-size: 13px; font-weight: 700; text-transform: uppercase;">Calcular Entrega</label>
        <div class="frete-container-inline">
            <input type="text" id="cep" class="form-control" placeholder="Digite seu CEP">
            <select id="tipo-envio" class="form-control" style="max-width: 120px;">
                <option value="pac">PAC</option>
                <option value="sedex">SEDEX</option>
            </select>
            <button onclick="calcularFrete()" class="btn btn-dark">Calcular</button>
        </div>
        <div id="info-frete" style="display: none;"></div>
    </div>

<div class="resumo-carrinho">
    <h3>Resumo do Pedido</h3>
    <hr>
    <div class="resumo-linha">
        <span>Subtotal:</span>
        <strong id="cart-subtotal">R$ 0,00</strong> </div>
    <div class="resumo-linha">
        <span>Taxa de Entrega:</span>
        <strong id="cart-frete">R$ 0,00</strong>    </div>
    <hr>
    <div class="resumo-linha total">
        <span>Total:</span>
        <strong id="cart-total">R$ 0,00</strong>    </div>
       <button class="btn-finalizar" onclick="finalizarCompra()">Finalizar Compra</button>
</div>

</section>
    <script src="js/main.js"></script>
    <script>document.addEventListener("DOMContentLoaded", renderizarPaginaCarrinho);</script>
</body>
</html>
